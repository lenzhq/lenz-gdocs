<body>
<p id="status" role="status">Opening the Google file picker…</p>
<p class="error" id="error" role="alert" hidden></p>
<script>
  // The per-Doc grant (Code.js "per-Doc access"), on Google's Picker pattern for Apps Script
  // (apps-script-samples/picker/dialog.html): the script's own token, the flavour's browser key
  // and Cloud project number, a view showing only this Doc. Picking it grants this script that one
  // file (drive.file). Every string is set with textContent.
  var LOAD_FAILED = 'The Google file picker did not load. Close this window and try again.';
  var config = null;
  var pickerLoaded = false;

  function $(id) { return document.getElementById(id); }
  function say(id, text) { var n = $(id); n.textContent = text || ''; n.hidden = !text; }

  // api.js calls this once it has loaded (the ?onload= parameter below).
  function onApiLoad() {
    gapi.load('picker', { callback: function () { pickerLoaded = true; openPicker(); } });
  }

  google.script.run
    .withSuccessHandler(function (c) { config = c; openPicker(); })
    .withFailureHandler(function () { say('error', LOAD_FAILED); })
    .lenzPickerConfig();

  // Runs when both the Picker library and the config are in, whichever comes last.
  function openPicker() {
    if (!config || !pickerLoaded) return;
    if (!config.token || !config.docId) { say('error', LOAD_FAILED); return; }
    var view = new google.picker.DocsView(google.picker.ViewId.DOCUMENTS).setFileIds(config.docId);
    var picker = new google.picker.PickerBuilder()
      .addView(view)
      .enableFeature(google.picker.Feature.NAV_HIDDEN)
      .hideTitleBar()
      .setOAuthToken(config.token)
      .setDeveloperKey(config.apiKey)
      .setAppId(config.appId)
      .setOrigin(google.script.host.origin)
      .setCallback(picked)
      .build();
    say('status', '');
    picker.setVisible(true);
  }

  function picked(data) {
    var action = data[google.picker.Response.ACTION];
    if (action === google.picker.Action.CANCEL) { google.script.host.close(); return; }
    if (action !== google.picker.Action.PICKED) return;
    var docs = data[google.picker.Response.DOCUMENTS] || [];
    var id = docs.length ? docs[0][google.picker.Document.ID] : null;
    if (id !== config.docId) { say('error', 'That is a different Doc. Close this window and choose the Doc you have open.'); return; }
    say('status', 'Saving your permission…');
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.ok) { google.script.host.close(); return; }
        say('status', '');
        say('error', (r && r.message) || LOAD_FAILED);
      })
      .withFailureHandler(function () { say('status', ''); say('error', LOAD_FAILED); })
      .lenzFileAccessGranted(id);
  }
</script>
<script src="https://apis.google.com/js/api.js?onload=onApiLoad"></script>
