  /* Lenz's design tokens, light theme, at the sidebar's 300 px: the web app's values (its primitives
     harmonised with the website: ink pill, ghost pill, quiet link, 4px radii, the .lz-verdict atom, the
     warmer verdict tints, ink rule + mono eyebrow). */
  :root {
    --cream: #FFFDF7; --warm-50: #FAF8F5; --warm-100: #F3F0EB; --warm-200: #E8E4DD; --warm-300: #D4CFC6;
    --warm-400: #6F6A64; --warm-500: #635E59; --warm-700: #3D3935; --warm-800: #2A2724; --warm-900: #1A1816;
    --primary: #3D65BC; --primary-hover: #31518F; --on-primary: #FFFFFF;
    --true: #14783A; --true-bg: #EEF7F0; --mostly-true: #A16207; --mostly-true-bg: #FBF5E6;
    --mixed: #635E59; --mixed-bg: #F4F2EE; --mostly-false: #C2410C; --mostly-false-bg: #FCF1EA;
    --false: #B91C1C; --false-bg: #FBEFEE;
    --radius: 4px; --radius-full: 9999px; --ls-eyebrow: 0.08em;
    --font-sans: 'Geist', 'Helvetica Neue', Arial, ui-sans-serif, system-ui, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px 12px 24px; background: var(--cream); color: var(--warm-700);
         font: 14px/1.5 var(--font-sans); }
  [hidden] { display: none !important; }
  /* A section opens on an ink rule, then its mono eyebrow (the site layer's section head, at sidebar size). */
  h1, h2 { font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: var(--ls-eyebrow);
           text-transform: uppercase; color: var(--warm-500); line-height: 1.5; margin: 0 0 4px; }
  h2 { margin-top: 24px; padding-top: 10px; border-top: 1px solid var(--warm-900); }
  p { margin: 0 0 8px; }
  a { color: var(--primary); }
  a:hover { color: var(--primary-hover); }
  /* Standalone links (See sources in Lenz, a source, lenz.io): the quiet link, ink with a hairline that turns blue. */
  p.line a, a.home-link { color: var(--warm-900); text-decoration-line: underline; text-decoration-color: var(--warm-300);
                          text-decoration-thickness: 1px; text-underline-offset: 4px; }
  p.line a:hover, a.home-link:hover { color: var(--warm-900); text-decoration-color: var(--primary); }
  label { display: block; font-size: 13px; color: var(--warm-800); margin-bottom: 4px; }
  input[type=password] { width: 100%; padding: 8px; border: 1px solid var(--warm-300); border-radius: var(--radius);
                         font: 13px var(--font-mono); background: #fff; color: var(--warm-900); }
  /* Buttons: the ghost pill by default, ink text in a hairline that steps to ink on hover; the
     primary is the ink pill, blue on hover; quiet is a link. Disabled fades, as .button[disabled] does. */
  button { font: 500 14px/1 var(--font-sans); letter-spacing: -0.005em; border-radius: var(--radius-full);
           padding: 10px 16px; cursor: pointer; border: 1px solid var(--warm-300); background: transparent;
           color: var(--warm-900); transition: background-color 0.2s, border-color 0.2s, color 0.2s; }
  button:hover:not(:disabled) { border-color: var(--warm-900); }
  button:disabled { cursor: not-allowed; opacity: 0.35; }
  button.primary { background: var(--warm-900); border-color: var(--warm-900); color: var(--cream); }
  button.primary:hover:not(:disabled) { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  button.quiet { border: 0; border-radius: 0; background: none; padding: 0; font-size: 13px; line-height: 1.5;
                 color: var(--warm-900); text-decoration-line: underline; text-decoration-color: var(--warm-300);
                 text-decoration-thickness: 1px; text-underline-offset: 4px; }
  button.quiet:hover:not(:disabled) { text-decoration-color: var(--primary); }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  .muted { color: var(--warm-400); font-size: 13px; }
  .error { color: var(--false); font-size: 13px; }
  .headline { font-size: 15px; font-weight: 500; letter-spacing: -0.012em; line-height: 1.35; color: var(--warm-900);
              margin-top: 12px; }
  .note { font-size: 13px; color: var(--warm-800); background: var(--warm-100); border-radius: var(--radius); padding: 8px; }
  ol.entries { list-style: none; margin: 0; padding: 0; }
  li.entry { border-top: 1px solid var(--warm-200); padding: 12px 0; }
  /* The section's ink rule is the first entry's top: one rule, never two. */
  ol.entries > li.entry:first-child { border-top: 0; }
  .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 4px; }
  /* The verdict label is the .lz-verdict atom: a dot in the verdict colour, then mono caps; never a filled pill. */
  .stamp { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px;
           font-weight: 500; letter-spacing: var(--ls-eyebrow); text-transform: uppercase; line-height: 1.25;
           white-space: nowrap; color: var(--warm-500); }
  .stamp::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .v-true { color: var(--true); }
  .v-mostly-true { color: var(--mostly-true); }
  .v-mixed { color: var(--mixed); }
  .v-mostly-false { color: var(--mostly-false); }
  .v-false { color: var(--false); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--warm-400); }
  .meta .seg { white-space: nowrap; }
  .title { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; background: none; padding: 0;
           font: 500 14px/1.45 var(--font-sans); letter-spacing: -0.005em; color: var(--warm-900); margin-bottom: 6px; }
  button.title { cursor: pointer; }
  button.title:hover { color: var(--primary); background: none; }
  .line { font-size: 13px; }
  .lead { font-weight: 500; color: var(--warm-800); }
  .edit { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 6px 0; font-size: 13px; }
  .from { text-decoration: line-through; color: var(--false); }
  .to { color: var(--true); font-weight: 500; }
  .edit button { padding: 6px 12px; font-size: 13px; }
  .step { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--warm-400); margin-bottom: 6px; }
  .step button { padding: 4px 10px; font-size: 12px; }
  /* A collapsed group opens on the same ink rule and eyebrow as h2. */
  details { margin-top: 24px; padding-top: 10px; border-top: 1px solid var(--warm-900); }
  details > summary { cursor: pointer; font-family: var(--font-mono); font-size: 12px; font-weight: 500;
                      letter-spacing: var(--ls-eyebrow); text-transform: uppercase; color: var(--warm-500); }
  details[open] > summary { margin-bottom: 4px; }
  ul.coverage { margin: 0; padding-left: 18px; font-size: 13px; }
  ul.coverage li { margin-bottom: 4px; }
  /* The running state: the Workbench's three dots, still under reduced motion. */
  .running { margin: 4px 0 12px; }
  .run-line { display: flex; align-items: baseline; font-size: 13px; color: var(--warm-800); margin: 0 0 6px; }
  .dots { display: inline-block; letter-spacing: 1px; }
  .dots i { font-style: normal; opacity: 0; animation: lenz-dot 1.4s infinite; }
  .dots i:nth-child(2) { animation-delay: 0.2s; }
  .dots i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes lenz-dot { 0%, 60%, 100% { opacity: 0; } 20%, 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: 1; } }
  ul.stages { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  ul.stages li { display: flex; justify-content: space-between; padding: 3px 0; border-top: 1px solid var(--warm-200); }
  ul.stages li:first-child { border-top: 0; }
  .stage-count { font-family: var(--font-mono); font-size: 12px; color: var(--warm-400); font-variant-numeric: tabular-nums; }
  .stage-done { color: var(--true); }
  /* A quick verdict whose deep check runs says so in body text, with the same dots: in the meta line
     it was read as nothing happening (and no corrections coming). Ink, not blue: it is not a link. */
  .deep-run { display: flex; align-items: baseline; font-size: 13px; font-weight: 500; color: var(--warm-800);
              margin: 2px 0 4px; }
  .deep-run-note { font-size: 12px; color: var(--warm-500); margin: 0 0 6px; }
  .foot { margin-top: 24px; border-top: 1px solid var(--warm-200); padding-top: 12px; }
  .foot .home-link { float: right; }
</style>
</head>
<body>
<section id="signin" hidden>
  <p>Sign in with your Lenz account to check this Doc. No account yet? You can create one when you sign in.</p>
  <div class="row"><button id="signin-go" class="primary" type="button" disabled>Sign in with Lenz</button></div>
  <p class="muted" id="signin-wait" role="status" hidden></p>
  <p class="error" id="signin-error" role="alert"></p>
  <p class="muted privacy"></p>
</section>

<section id="main" hidden>
  <div class="row">
    <button id="check" class="primary" type="button">Check this Doc</button>
  </div>
  <div class="row"><button id="check-selection" class="quiet" type="button">Check only the selected text</button></div>
  <div id="access" hidden>
    <p id="access-line"></p>
    <div class="row"><button id="access-go" class="primary" type="button">Allow Lenz to read this Doc</button></div>
    <p class="muted" id="access-wait" role="status" hidden></p>
    <p class="error" id="access-error" role="alert" hidden></p>
  </div>
  <p class="muted" id="updating" hidden></p>
  <p id="status" role="status" aria-live="polite"></p>
  <div class="running" id="running" hidden>
    <p class="run-line"><span id="elapsed"></span><span class="dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></p>
    <ul class="stages" id="stages"></ul>
  </div>
  <p id="stalled" role="status" hidden></p>
  <p class="error" id="error" role="alert"></p>
  <div id="failure-link"></div>
  <div class="row" id="resume-row" hidden><button id="resume" class="primary" type="button">Resume</button></div>
  <p class="note" id="note" role="status" hidden></p>
  <p class="headline" id="headline" hidden></p>
  <p class="muted" id="scope" hidden></p>
  <div id="groups"></div>
  <section id="coverage-box" hidden>
    <h2>What was not covered</h2>
    <ul class="coverage" id="coverage"></ul>
  </section>
  <p class="muted" id="footnote" hidden></p>
  <div class="foot"><span class="muted" id="account-line"></span>
    <button id="signout" class="quiet" type="button" hidden>Sign out</button>
    <a class="home-link" href="https://lenz.io/?utm_source=google-docs&amp;utm_medium=addon&amp;utm_campaign=sidebar" target="_blank" rel="noopener noreferrer">lenz.io</a></div>
</section>

<script>
  // Every string from Lenz or the Doc is set with textContent, never innerHTML.
  // The server functions take ids only: no text from here reaches the Doc or Lenz.
  var PRIVACY = "Lenz receives this tab's text to check it and keeps the check in your Lenz account. Deleting your account deletes it.";
  // Never invite leaving the panel: nothing tells you when the check is done.
  var RUNNING = 'You can keep editing while Lenz checks this tab. First results appear here in under a minute; the full check takes two to four minutes.';
  var RUNNING_SELECTION = 'You can keep editing while Lenz checks the text you selected. First results appear here in under a minute; the full check takes two to four minutes.';
  var RESUMED = 'Your check is still running. Results appear here when it finishes.';
  // Polling stopped after minutes without an answer; the review is kept and Resume looks at it again.
  var STALLED = 'Lenz is not answering. Your check is kept; choose Resume to look again.';
  var GLUE_FAILED = 'The add-on could not finish that. Try again.';
  var SIGN_IN_WAIT = 'Finish signing in in the window that opened. This panel updates when you are done.';
  var POPUP_BLOCKED = 'Your browser blocked the sign-in window. Allow pop-ups for docs.google.com, then try again.';
  var SIGN_IN_URL_MS = 8 * 60 * 1000; // a sign-in link is good for 10 minutes on the server
  var SIGN_IN_WAIT_MS = 10 * 60 * 1000;
  var signIn = { url: null, at: 0, waitUntil: 0, timer: null, failed: false };
  // Per-Doc access (Code.js "per-Doc access"): Lenz reads a Doc only once it is allowed to, Doc by Doc.
  var ACCESS_LINE = 'Before Lenz can check this Doc, Google needs your permission. Lenz asks once for each Doc and cannot open your other Docs.';
  var ACCESS_WAIT = 'Choose this Doc in the window that opened, then Select. This panel continues when you are done.';
  var ACCESS_WAIT_MS = 10 * 60 * 1000;
  // `retry`: what the user was doing (Check, a poll, Select, Apply, Undo), repeated once allowed.
  var access = { retry: null, since: 0, until: 0, timer: null };

  var $ = function (id) { return document.getElementById(id); };
  var busy = false;
  var queued = null;
  var timer = null;
  var phase = null;
  var resumed = false; // the panel opened on a check already running (a reopen)
  var startedAt = null; // the running check's start in ms, for the elapsed time
  var last = null; // the last state rendered, to fall back on when a call fails
  var shown = null; // the review id the list shows; Select and Apply name it
  var steps = {}; // entry id -> occurrence shown ("1 of N")
  var folds = {}; // group key -> open, once the reader opened or closed that group

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function show(n, on) { n.hidden = !on; }
  function setText(id, text) { var n = $(id); n.textContent = text || ''; show(n, !!text); }
  // Check this Doc and Check only the selected text are on and off together.
  function setCheck(off) { $('check').disabled = off; $('check-selection').disabled = off; }

  // One call in flight; a click made meanwhile runs next (the latest one wins).
  // A failed call restores the last state (its buttons come back) and says so.
  // `dropped`: runs when a later click replaces this call while it waits (only the latest waits).
  function call(fn, args, done, dropped) {
    if (busy) {
      if (queued && queued[3]) queued[3]();
      queued = [fn, args, done, dropped];
      return;
    }
    busy = true;
    google.script.run
      .withSuccessHandler(function (r) { busy = false; done(r); drain(); })
      .withFailureHandler(function () {
        busy = false;
        writing = false;
        if (last) {
          render(last);
        } else {
          // The first call failed: show the main screen so the error and Check are visible.
          show($('main'), true);
          setCheck(false);
        }
        setText(last && last.phase === 'signed_out' ? 'signin-error' : 'error', GLUE_FAILED);
        setText('updating', ''); // the kept list is not being updated: the call failed
        if (phase === 'running' && !timer) schedule(15);
        drain();
      })[fn].apply(null, args);
  }
  function drain() {
    if (!queued) return;
    var q = queued; queued = null;
    call(q[0], q[1], q[2], q[3]);
  }

  function schedule(seconds) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () {
      timer = null;
      if (busy) { schedule(1); return; }
      call('lenzPoll', [], render);
    }, Math.max(1, seconds) * 1000);
  }

  function render(r) {
    if (!r || typeof r !== 'object') return;
    if (timer) { clearTimeout(timer); timer = null; }
    // Lenz may not read this Doc yet: ask, keep the list as it was, and read the state again once allowed.
    // An action already waiting for the grant (Select, Apply, Undo, Check) keeps its place.
    if (r.phase === 'needs_file_access') { askAccess(access.retry || function () { call('lenzState', [], render); }); return; }
    var place = readingPlace();
    show($('access'), false);
    stopAccessWait();
    last = r;
    phase = r.phase;
    var id = r.model && r.model.reviewId ? r.model.reviewId : null;
    if (id !== shown) { steps = {}; folds = {}; place = null; } // entry ids repeat across reviews
    shown = id;
    var signedOut = r.phase === 'signed_out';
    show($('signin'), signedOut);
    show($('main'), !signedOut);
    if (signedOut) {
      setText('signin-error', r.error ? r.error.message : '');
      // A link that failed to load is fetched again only on a click, never in a loop.
      if (!signInFresh() && !signIn.failed) loadSignInUrl();
      if (signIn.failed) $('signin-go').disabled = false;
      var waiting = Date.now() < signIn.waitUntil;
      setText('signin-wait', waiting ? SIGN_IN_WAIT : '');
      if (waiting) waitForSignIn();
      return;
    }
    signIn.waitUntil = 0;
    setText('signin-wait', '');
    var auth = r.auth || {};
    setText('account-line', auth.mode === 'key' ? 'Using an API key (dev tools).' : 'Signed in to Lenz.');
    show($('signout'), auth.mode !== 'key');

    var running = r.phase === 'running';
    var stalled = r.phase === 'stalled';
    var done = r.phase === 'done';
    // Stalled: Check this Doc would read the Doc again and may send a new review; only Resume acts.
    setCheck(running || stalled);
    setText('stalled', stalled ? STALLED : '');
    show($('resume-row'), stalled);
    $('resume').disabled = false;
    var m = r.model;
    if (!running) resumed = false;
    setText('status', running ? (resumed ? RESUMED : r.selection ? RUNNING_SELECTION : RUNNING) : '');
    startedAt = running && typeof r.startedAt === 'number' ? r.startedAt : null;
    show($('running'), running);
    renderStages(running && m ? m.stages : null);
    tick();
    setText('error', r.error ? r.error.message : '');
    // Check this Doc on an unchanged, completed Doc: the same results, said so.
    if (r.notice) note(r.notice);

    setText('headline', m ? m.headline : '');
    setText('scope', m ? m.scope : '');
    if (m && m.failure) setText('error', m.failure);
    var fl = $('failure-link');
    clear(fl);
    if (m && m.failureLink) fl.appendChild(link(m.failureLink.href, m.failureLink.words));
    renderGroups(m);
    var cov = $('coverage');
    clear(cov);
    (m ? m.coverage : []).forEach(function (line) { cov.appendChild(el('li', null, line)); });
    show($('coverage-box'), !!(m && m.coverage.length));
    setText('footnote', m ? m.footnote : '');

    // Only over a list kept from last time; with none, there is nothing to update.
    setText('updating', r.stale && m ? 'Updating…' : '');
    keepPlace(place);
    // A remembered reply is shown only until the real one arrives; it schedules nothing.
    if (running && r.nextPollS && !r.stale) schedule(r.nextPollS);
  }

  // Every poll rebuilds the list while the reader may be reading it: rows above grow as their deep
  // checks finish, the running lines go when the check ends. The entry being read keeps its place
  // on screen (the focused one if it is in view, else the one being read), and focus comes back to
  // the same control. At the top of the panel nothing is held, so new results show (the browser's
  // own scroll anchoring does the same).
  function readingPlace() {
    var place = { at: [], focus: null };
    var a = document.activeElement;
    var li = a && a.closest ? a.closest('li.entry') : null;
    if (li && li.getAttribute('data-id') && a.getAttribute('data-focus')) {
      place.focus = { id: li.getAttribute('data-id'), key: a.getAttribute('data-focus') };
    }
    if (window.scrollY <= 0) return place;
    // A reader scrolls the entry they read to the top: the first entry that starts in view, not one
    // scrolled mostly out of view above it (which grows when its own deep check ends).
    var h = window.innerHeight;
    Array.prototype.forEach.call(document.querySelectorAll('#groups li.entry'), function (n) {
      var box = n.getBoundingClientRect();
      if (box.height && box.bottom > 0 && box.top < h) place.at.push({ id: n.getAttribute('data-id'), top: box.top });
    });
    function rank(x) { return place.focus && x.id === place.focus.id ? 0 : x.top >= 0 ? 1 : 2; }
    place.at.sort(function (x, y) { return rank(x) - rank(y); }); // stable: document order within a rank
    return place;
  }

  function keepPlace(place) {
    if (!place) return;
    // The first one still shown (an entry may have moved into a closed group).
    for (var i = 0; i < place.at.length; i++) {
      var n = entryNode(place.at[i].id);
      var box = n && n.getBoundingClientRect();
      if (box && box.height) { window.scrollBy(0, box.top - place.at[i].top); break; }
    }
    // By what the control is, never by where it sits: a poll can add an edit above the focused one,
    // and Enter must not then apply a different correction.
    var li = place.focus && entryNode(place.focus.id);
    var c = li && Array.prototype.filter.call(li.querySelectorAll('button, a'), function (n) {
      return n.getAttribute('data-focus') === place.focus.key;
    })[0];
    if (c && !c.disabled) c.focus({ preventScroll: true });
  }

  function entryNode(id) {
    var all = document.querySelectorAll('#groups li.entry');
    for (var i = 0; i < all.length; i++) if (all[i].getAttribute('data-id') === id) return all[i];
    return null;
  }

  // 1:42, 12:05, 1:02:05.
  function clock(ms) {
    var t = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(t / 3600), mnt = Math.floor((t % 3600) / 60), sec = t % 60;
    var two = function (x) { return (x < 10 ? '0' : '') + x; };
    return h ? h + ':' + two(mnt) + ':' + two(sec) : mnt + ':' + two(sec);
  }

  // Ticks every second between polls; no server call.
  function tick() {
    $('elapsed').textContent = startedAt === null ? 'Checking' : 'Running for ' + clock(Date.now() - startedAt);
  }
  setInterval(function () { if (phase === 'running') tick(); }, 1000);

  function renderStages(stages) {
    var ul = $('stages');
    clear(ul);
    (stages || []).forEach(function (st) {
      var li = el('li');
      li.appendChild(el('span', null, st.label));
      if (st.complete) li.appendChild(el('span', 'stage-count stage-done', '\u2713 ' + st.done + ' of ' + st.total));
      else if (typeof st.total === 'number') li.appendChild(el('span', 'stage-count', st.done + ' of ' + st.total));
      ul.appendChild(li);
    });
    show(ul, !!(stages && stages.length));
  }

  function renderGroups(m) {
    var box = $('groups');
    clear(box);
    if (!m) return;
    var noted = false; // the deep check's note goes under the first claim whose deep check runs
    m.groups.forEach(function (g) {
      var list = el('ol', 'entries');
      g.entries.forEach(function (e) {
        list.appendChild(renderEntry(e, e.deepRunning && !noted));
        if (e.deepRunning) noted = true;
      });
      if (g.collapsed) {
        var d = el('details');
        // Open as the reader left it: a poll never folds a group they opened.
        if (folds[g.key] === true) d.open = true;
        d.addEventListener('toggle', function () { folds[g.key] = d.open; });
        d.appendChild(el('summary', null, g.title + ' (' + g.count + ')'));
        d.appendChild(list);
        box.appendChild(d);
      } else {
        box.appendChild(el('h2', null, g.title + ' (' + g.count + ')'));
        box.appendChild(list);
      }
    });
  }

  function renderEntry(e, note) {
    var li = el('li', 'entry');
    li.setAttribute('data-id', e.id);
    var head = el('div', 'head');
    head.appendChild(el('span', 'stamp' + (e.token ? ' v-' + e.token : ''), e.label));
    var meta = [];
    if (e.check) meta.push(e.check);
    if (e.confidence) meta.push('confidence ' + e.confidence);
    if (typeof e.score === 'number') meta.push(e.score + '/10');
    // Each segment stays whole ("confidence medium"); the line breaks only between segments.
    if (meta.length) {
      var mt = el('span', 'meta');
      meta.forEach(function (m, i) {
        if (i) mt.appendChild(document.createTextNode(' · '));
        mt.appendChild(el('span', 'seg', m));
      });
      head.appendChild(mt);
    }
    li.appendChild(head);

    var occ = Math.min(steps[e.id] || 0, Math.max(0, e.occurrences - 1));
    steps[e.id] = occ;
    if (e.placed && e.occurrences > 0) {
      var t = el('button', 'title', e.title);
      t.type = 'button';
      t.title = 'Select these words in the Doc';
      t.setAttribute('data-focus', 'title');
      t.addEventListener('click', function () { select(e.id, steps[e.id] || 0); });
      li.appendChild(t);
    } else {
      li.appendChild(el('p', 'title', e.title));
    }
    if (e.placed && e.occurrences > 1) li.appendChild(stepper(e, occ));
    if (e.placeNote) li.appendChild(el('p', 'line muted', e.placeNote));
    if (e.deepRunning) {
      var run = el('p', 'deep-run');
      run.appendChild(el('span', null, 'Deep check running'));
      run.appendChild(dots());
      li.appendChild(run);
      if (note) li.appendChild(el('p', 'deep-run-note', 'Sources and any corrections appear here when it finishes.'));
    }

    if (e.rewrite) li.appendChild(line('Suggested rewrite: ', e.rewrite));
    e.lines.forEach(function (l) { li.appendChild(line(l.lead, l.text)); });
    if (e.source) li.appendChild(link(e.source.href, 'Source: ' + e.source.words));
    e.edits.forEach(function (x) { li.appendChild(editRow(x)); });
    if (e.editsNote) li.appendChild(el('p', 'line muted', e.editsNote));
    if (e.link) li.appendChild(link(e.link.href, e.link.words));
    return li;
  }

  // The three dots of the running state (decorative: the words say it).
  function dots() {
    var d = el('span', 'dots');
    d.setAttribute('aria-hidden', 'true');
    for (var i = 0; i < 3; i++) d.appendChild(el('i', null, '.'));
    return d;
  }

  function line(lead, text) {
    var p = el('p', 'line');
    if (lead) p.appendChild(el('span', 'lead', lead));
    p.appendChild(document.createTextNode(text));
    return p;
  }

  function link(href, words) {
    var p = el('p', 'line');
    var a = el('a', null, words);
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.setAttribute('data-focus', 'link:' + href);
    p.appendChild(a);
    return p;
  }

  function stepper(e, occ) {
    var box = el('div', 'step');
    var prev = el('button', null, 'Previous');
    var next = el('button', null, 'Next');
    prev.type = next.type = 'button';
    prev.setAttribute('data-focus', 'previous');
    next.setAttribute('data-focus', 'next');
    prev.disabled = occ === 0;
    next.disabled = occ >= e.occurrences - 1;
    var label = el('span', null, (occ + 1) + ' of ' + e.occurrences);
    function go(d) {
      steps[e.id] = Math.max(0, Math.min(e.occurrences - 1, (steps[e.id] || 0) + d));
      label.textContent = (steps[e.id] + 1) + ' of ' + e.occurrences;
      prev.disabled = steps[e.id] === 0;
      next.disabled = steps[e.id] >= e.occurrences - 1;
      select(e.id, steps[e.id]);
    }
    prev.addEventListener('click', function () { go(-1); });
    next.addEventListener('click', function () { go(1); });
    box.appendChild(prev); box.appendChild(label); box.appendChild(next);
    return box;
  }

  // One edit write at a time: the clicked button says what it is doing at
  // once, every other Apply / Undo waits until the answer is in.
  var writing = false;
  function editButtons(on) {
    Array.prototype.forEach.call(document.querySelectorAll('.edit button'), function (b) { b.disabled = !on; });
  }

  // `target`: { claimIndex, editIndex, fp }: the edit to apply, or the applied one to undo. fp is the
  // edit's fingerprint (view.js editFp): the server acts only if it is still that edit.
  function writeEdit(fn, button, busyWords, target) {
    if (writing) return;
    writing = true;
    if (button) button.textContent = busyWords;
    editButtons(false);
    call(fn, [shown, target.claimIndex, target.editIndex, target.fp], function (r) {
      writing = false;
      if (r && r.phase === 'needs_file_access') {
        if (last) render(last);
        askAccess(function () { writeEdit(fn, null, busyWords, target); });
        return;
      }
      if (r && r.phase) render(r);
      else if (last) render(last); // refused: the list as it was, buttons back
      note(r && r.message);
    }, function () {
      // Replaced before it ran (a later click): nothing was written; the buttons come back.
      writing = false;
      if (last) render(last);
    });
  }

  // x.mode: apply | applied | suggest (an applied edit changed its words: shown, no Apply).
  function editRow(x) {
    var wrap = el('div', 'edit-wrap');
    if (x.mode === 'suggest') wrap.appendChild(el('p', 'line lead', 'Now suggested:'));
    if (x.earlier) wrap.appendChild(el('p', 'line muted', 'Applied earlier:'));
    var row = el('div', 'edit');
    wrap.appendChild(row);
    row.appendChild(el('span', 'from', x.from));
    row.appendChild(el('span', 'muted', '→'));
    row.appendChild(el('span', 'to', x.to));
    if (x.mode === 'applied') {
      row.appendChild(el('span', 'muted', 'Applied'));
      var u = el('button', null, 'Undo');
      u.type = 'button';
      u.disabled = writing || !x.undo;
      u.setAttribute('aria-label', 'Undo: put back “' + x.from + '”');
      u.setAttribute('data-focus', 'edit:' + x.id); // Apply and its Undo: the same edit
      u.addEventListener('click', function () { writeEdit('lenzUndo', u, 'Undoing…', x.undo); });
      row.appendChild(u);
      return wrap;
    }
    if (x.mode === 'suggest') {
      wrap.appendChild(el('p', 'line muted', 'An edit already applied changed these words. Undo it first to apply this one.'));
      return wrap;
    }
    var b = el('button', null, 'Apply');
    b.type = 'button';
    b.disabled = writing;
    b.setAttribute('aria-label', 'Apply: replace “' + x.from + '” with “' + x.to + '”');
    b.setAttribute('data-focus', 'edit:' + x.id);
    b.addEventListener('click', function () { writeEdit('lenzApply', b, 'Applying…', x); });
    row.appendChild(b);
    return wrap;
  }



  function select(id, occurrence) {
    if (writing) return; // one edit write at a time; a selection waits for it
    call('lenzSelect', [shown, id, occurrence], function (r) {
      if (r && r.phase === 'needs_file_access') { askAccess(function () { select(id, occurrence); }); return; }
      note(r && !r.ok ? r.message : '');
    });
  }

  function note(text) { setText('note', text || ''); }

  function startCheck() {
    note('');
    resumed = false;
    setCheck(true);
    call('lenzStart', [], function (r) {
      if (r && r.phase === 'needs_file_access') { askAccess(startCheck); return; }
      render(r);
    });
  }
  // After a grant asked for on opening: lenzAutoStart refreshes a check already running and otherwise
  // runs Check this Doc (unchanged text with a completed review: its results again, no charge).
  function autoStart() {
    note('');
    resumed = false;
    setCheck(true);
    call('lenzAutoStart', [], function (r) {
      if (r && r.phase === 'needs_file_access') { askAccess(autoStart); return; }
      render(r);
    });
  }
  $('check').addEventListener('click', startCheck);
  // A note (nothing selected, …) sends nothing: the panel stays as it was and says why.
  function startSelection() {
    note('');
    resumed = false;
    setCheck(true);
    call('lenzStartSelection', [], function (r) {
      if (r && r.phase === 'needs_file_access') { askAccess(startSelection); return; }
      if (r && !r.phase) {
        if (last) render(last); else setCheck(false);
        note(r.message);
        return;
      }
      render(r);
    });
  }
  $('check-selection').addEventListener('click', startSelection);
  // After polling gave up: look at the saved check again (never a new one, never a read of the Doc).
  $('resume').addEventListener('click', function () {
    note('');
    $('resume').disabled = true;
    call('lenzResume', [], render);
  });

  // Per-Doc access: the line and the button; the Picker opens in a dialog (picker.html). While it is
  // open, the panel asks every 2 s whether this Doc has been allowed since, then repeats `retry`.
  function askAccess(retry) {
    access.retry = retry;
    // No review polling while waiting: a poll's reply would replace the prompt or the waiting action.
    // The retry (or the state it reads) schedules the next poll.
    if (timer) { clearTimeout(timer); timer = null; }
    // Only "Allow Lenz to read this Doc" acts until the grant: Check this Doc is off (render, after the
    // retry, turns it back on).
    setCheck(true);
    show($('signin'), false);
    show($('main'), true);
    setText('access-line', ACCESS_LINE);
    setText('access-error', '');
    setText('updating', ''); // the real state answered: Lenz needs this Doc first
    $('access-go').disabled = false;
    show($('access'), true);
  }
  function stopAccessWait() {
    if (access.timer) clearTimeout(access.timer);
    access.timer = null;
    access.until = 0;
    setText('access-wait', '');
  }
  function waitForAccess() {
    if (access.timer) clearTimeout(access.timer);
    access.timer = null;
    if (Date.now() >= access.until) { stopAccessWait(); return; }
    access.timer = setTimeout(function () {
      access.timer = null;
      if (busy) { waitForAccess(); return; }
      call('lenzFileAccessReady', [access.since], function (x) {
        if (!x || !x.ready) { waitForAccess(); return; }
        stopAccessWait();
        show($('access'), false);
        var retry = access.retry;
        access.retry = null;
        // Check this Doc back as the state has it (a retried Check or auto-start turns it off again).
        setCheck(phase === 'running');
        if (retry) retry();
        // Review polling stopped while waiting (askAccess); a retried Select renders no state, so a
        // running check's polling starts again here (a reply that renders replaces this timer).
        if (phase === 'running' && !timer) schedule(3);
      });
    }, 2000);
  }
  $('access-go').addEventListener('click', function () {
    setText('access-error', '');
    $('access-go').disabled = true;
    call('lenzShowPicker', [], function (o) {
      $('access-go').disabled = false;
      if (!o || typeof o.openedAt !== 'number') { setText('access-error', GLUE_FAILED); return; }
      access.since = o.openedAt;
      access.until = Date.now() + ACCESS_WAIT_MS;
      setText('access-wait', ACCESS_WAIT);
      waitForAccess();
    });
  });
  // Signing in: the sign-in link is fetched ahead, so the window opens in the click itself (a
  // window opened later is blocked as a pop-up). The link is single-use; the next one is fetched.
  function signInFresh() { return !!signIn.url && Date.now() - signIn.at < SIGN_IN_URL_MS; }
  function loadSignInUrl() {
    $('signin-go').disabled = true;
    // Failed until it succeeds: a call that fails outright re-renders, and must not load again.
    signIn.failed = true;
    call('lenzSignInUrl', [], function (u) {
      if (u && u.url) {
        signIn.url = u.url;
        signIn.at = Date.now();
        signIn.failed = false;
      } else {
        signIn.url = null;
        setText('signin-error', (u && u.message) || GLUE_FAILED);
      }
      $('signin-go').disabled = false;
    });
  }
  // While the sign-in window is open: look every 3 s (and when the panel gets focus back).
  function waitForSignIn() {
    if (signIn.timer) clearTimeout(signIn.timer);
    signIn.timer = null;
    if (phase !== 'signed_out' || Date.now() >= signIn.waitUntil) return;
    signIn.timer = setTimeout(function () {
      signIn.timer = null;
      if (busy) { waitForSignIn(); return; }
      call('lenzState', [], render);
    }, 3000);
  }
  $('signin-go').addEventListener('click', function () {
    if (!signInFresh()) { loadSignInUrl(); return; }
    setText('signin-error', '');
    var win = window.open(signIn.url, 'lenz-sign-in', 'width=520,height=720');
    if (!win) { setText('signin-error', POPUP_BLOCKED); return; }
    signIn.url = null;
    signIn.waitUntil = Date.now() + SIGN_IN_WAIT_MS;
    setText('signin-wait', SIGN_IN_WAIT);
    waitForSignIn();
    loadSignInUrl();
  });
  window.addEventListener('focus', function () {
    if (phase === 'signed_out' && Date.now() < signIn.waitUntil && !busy) call('lenzState', [], render);
  });
  $('signout').addEventListener('click', function () {
    note('');
    call('lenzSignOut', [], render);
  });

  Array.prototype.forEach.call(document.querySelectorAll('.privacy'), function (n) { n.textContent = PRIVACY; });
  // Open: the last list for this tab at once (no network), then the real state.
  var opened = Date.now();
  var msFirst = null;
  call('lenzOpen', [], function (r) {
    msFirst = Date.now() - opened;
    if (r && r.phase) render(r);
    // lenzOpenState: the state, and whether Lenz may read this Doc yet. Asked on opening, the grant
    // then starts the check (opening the sidebar from Check this Doc is the intent): autoStart.
    call('lenzOpenState', [], function (full) {
      resumed = !!(full && full.phase === 'running');
      if (full && full.phase === 'needs_file_access') askAccess(autoStart);
      else render(full);
      call('lenzLogOpen', [msFirst, Date.now() - opened], function () {});
    });
  });
</script>
</body>
</html>
