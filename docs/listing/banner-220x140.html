<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Geist;src:url(geist.woff2) format('woff2');font-weight:100 900}
body{font-family:Geist,Helvetica,sans-serif;background:#eceae4;color:#3D3935;margin:24px}
h2{font-size:15px;margin:28px 0 8px}
.row{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.b{width:220px;height:140px;background:#FFFDF7;position:relative;overflow:hidden;box-shadow:0 0 0 1px #ddd;flex:none}
.x2{transform:scale(2);transform-origin:top left;margin:0 220px 140px 0}
.mark{position:absolute;right:12px;bottom:9px;font-weight:700;font-size:15px;letter-spacing:-.02em}
.mark i{font-style:normal;color:#3D65BC}
.s{position:absolute;left:18px;top:30px;right:14px;font-size:21px;line-height:1.22;font-weight:500;letter-spacing:-.01em}
.del{text-decoration:line-through;text-decoration-thickness:2px}
.B .del{color:#C5221F}.B .ins{color:#3D65BC;font-weight:650}
.C .del,.C .ins{color:#188038}.C .ins{border-bottom:2px solid #188038}
.D .del{color:#9a948c}.D .ins{background:#3D65BC;color:#fff;padding:0 4px;border-radius:4px;font-weight:600}
.wm{position:absolute;left:0;right:0;top:34px;text-align:center;font-weight:700;font-size:58px;letter-spacing:-.04em;line-height:1}
.wm i{font-style:normal;color:#3D65BC}.wm small{display:block;font-size:12px;font-weight:500;letter-spacing:0;margin-top:6px}
.card{width:220px;background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.2);overflow:hidden;font-family:Roboto,Arial,sans-serif}
.card .meta{padding:10px 12px 12px;display:flex;gap:10px}
.card .ic{width:32px;height:32px;flex:none;border:1px solid #eee;border-radius:4px;display:flex;align-items:center;justify-content:center;font:700 11px Geist;color:#3D3935}
.card .t{font-size:14px;color:#202124}.card .d{font-size:12px;color:#5f6368;margin-top:2px;line-height:1.3}
 body{margin:0;background:#FFFDF7} .b{box-shadow:none}</style></head><body><div class="b B"><div class="s">The Eiffel Tower is in <span class="del">Berlin</span> <span class="ins">Paris</span>.</div><div class="mark">lenz<i>.</i></div></div></body></html>
